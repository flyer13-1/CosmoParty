<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
      <link rel="stylesheet" href="タイトル.css">
    <title>Cosmo Party</title>
</head>
<body> <div id="message">
     <h1 id="title">Cosmo PartyⅡ</h1>  
   
       <p id="start">ボタンを押してください</p>
        </div>
        <div id="menu"><a href="モード.html">
<button id="ゲームスタート">モード選択</button>
</a>
    <button id="ユーザ登録">ユーザー登録</button>
    <button id="スコア">スコア</button>
    <button id="設定">設定</button>
    <button id="終了">終了</button></div>
           <script>
  
const title = document.getElementById("title");
const start = document.getElementById("start");
const menu = document.getElementById("menu");

const menuButtons = [
    document.getElementById("ゲームスタート"),
    document.getElementById("ユーザ登録"),
    document.getElementById("スコア"),
    document.getElementById("設定"),
    document.getElementById("終了")
];

let selectedIndex = 0;
let previousButtons = [];
let previousStickDirection = 0;
let menuOpened = false;

function showMenu() {
    if (menuOpened) return;

    menuOpened = true;

    start.style.display = "none";

    title.style.transform =
        "translateX(-200px) rotate(365deg)";

    menu.style.display = "block";

    selectMenu(0);
}

function selectMenu(index) {
    selectedIndex =
        (index + menuButtons.length) % menuButtons.length;

    menuButtons.forEach((button, i) => {
        button.style.outline =
            i === selectedIndex
                ? "3px solid yellow"
                : "none";
    });
}

// キーボード操作
document.addEventListener("keydown", function(e) {
    if (e.repeat) return;

    if (!menuOpened) {
        showMenu();
        return;
    }

    if (e.key === "ArrowDown") {
        selectMenu(selectedIndex + 1);
    }

    if (e.key === "ArrowUp") {
        selectMenu(selectedIndex - 1);
    }

    if (e.key === "Enter") {
        menuButtons[selectedIndex].click();
    }
});

// ゲームパッド接続
window.addEventListener("gamepadconnected", function(e) {
    console.log("ゲームパッド接続:", e.gamepad.id);
});

// ゲームパッド操作
function testPads() {
    const pads = navigator.getGamepads();

    for (const pad of pads) {
        if (!pad) continue;

        // 左スティック上下
        const stickY = pad.axes[1];

        let direction = 0;

        if (stickY > 0.5) {
            direction = 1;
        } else if (stickY < -0.5) {
            direction = -1;
        }

        if (menuOpened &&
            direction !== 0 &&
            direction !== previousStickDirection) {

            selectMenu(selectedIndex + direction);
        }

        previousStickDirection = direction;

        // Aボタン
        const aPressed = pad.buttons[0].pressed;

        if (aPressed && !previousButtons[0]) {

            if (!menuOpened) {
                // 1回目：メニューを表示するだけ
                showMenu();
            } else {
                // 2回目以降：選択項目を決定
                menuButtons[selectedIndex].click();
            }
        }

        previousButtons = pad.buttons.map(
            button => button.pressed
        );
    }

    requestAnimationFrame(testPads);
}

requestAnimationFrame(testPads);

</script>

</body>
</html>
