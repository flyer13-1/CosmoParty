<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<title>コントローラーテスト</title>
<style>
body{
    background:#222;
    color:white;
    font-family:sans-serif;
    text-align:center;
    padding-top:50px;
}
#status{
    font-size:24px;
    margin-bottom:20px;
}
</style>
</head>
<body>

<h1>ゲームコントローラー認識テスト</h1>
<div id="status">未接続</div>
<pre id="info"></pre>

<script>
const statusText = document.getElementById("status");
const info = document.getElementById("info");

window.addEventListener("gamepadconnected", (e) => {
    statusText.textContent = "接続: " + e.gamepad.id;
    console.log("接続", e.gamepad);
});

window.addEventListener("gamepaddisconnected", () => {
    statusText.textContent = "未接続";
    info.textContent = "";
});

function update() {
    const gamepads = navigator.getGamepads();

    for (const pad of gamepads) {
        if (!pad) continue;

        let text = "";
        text += `名前: ${pad.id}\n`;
        text += `ボタン数: ${pad.buttons.length}\n\n`;

        pad.buttons.forEach((btn, i) => {
            text += `Button ${i}: ${btn.pressed}\n`;
        });

        text += "\nスティック\n";

        pad.axes.forEach((axis, i) => {
            text += `Axis ${i}: ${axis.toFixed(2)}\n`;
        });

        info.textContent = text;
    }

    requestAnimationFrame(update);
}

update();
</script>

</body>
</html>
