<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>人数選択</title>

<style>
body{
    text-align:center;
    font-family:sans-serif;
}

#players{
    display:flex;
    justify-content:center;
    gap:20px;
    flex-wrap:wrap;
}

.player{
    width:180px;
    border:1px solid #ccc;
    border-radius:10px;
    padding:10px;
}

.player img{
    width:100px;
    display:none;
}

.name{
    font-size:12px;
    word-break:break-all;
    color:#666;
}

#connectedPads{
    margin-top:20px;
}
</style>
</head>
<body>

<h1>人数選択</h1>

<button onclick="setPlayerCount(1)">1人</button>
<button onclick="setPlayerCount(2)">2人</button>
<button onclick="setPlayerCount(3)">3人</button>
<button onclick="setPlayerCount(4)">4人</button>

<br><br>

<div id="players">

    <div class="player" id="player1">
        <h3>1P</h3>
        <img id="pad1Img" src="img/hello.png">
        <p id="pad1Text">Aボタンで参加</p>
        <div id="pad1Name" class="name"></div>
    </div>

    <div class="player" id="player2">
        <h3>2P</h3>
        <img id="pad2Img" src="img/hello.png">
        <p id="pad2Text">Aボタンで参加</p>
        <div id="pad2Name" class="name"></div>
    </div>

    <div class="player" id="player3">
        <h3>3P</h3>
        <img id="pad3Img" src="img/hello.png">
        <p id="pad3Text">Aボタンで参加</p>
        <div id="pad3Name" class="name"></div>
    </div>

    <div class="player" id="player4">
        <h3>4P</h3>
        <img id="pad4Img" src="img/hello.png">
        <p id="pad4Text">Aボタンで参加</p>
        <div id="pad4Name" class="name"></div>
    </div>

</div>

<div id="connectedPads"></div>

<br>

<button onclick="history.back()">戻る</button>
<button id="nextBtn" disabled>次へ</button>

<script>

let targetPlayers = 1;

// 1P～4Pに対応するGamepad番号を保存
const players = [null, null, null, null];

// ボタン前回状態
const padBtnBf = [false, false, false, false];

function setPlayerCount(num){

    targetPlayers = num;

    for(let i=1;i<=4;i++){
        document.getElementById(`player${i}`).style.display =
            i <= num ? "block" : "none";
    }

    checkReady();
}

function registerPad(padIndex){

    // 既に参加済みなら無視
    if(players.includes(padIndex)) return;

    const playerIndex = players.indexOf(null);

    if(playerIndex === -1) return;

    const pad = navigator.getGamepads()[padIndex];

    players[playerIndex] = padIndex;

    document.getElementById(`pad${playerIndex + 1}Img`)
        .style.display = "block";

    document.getElementById(`pad${playerIndex + 1}Text`)
        .textContent = "参加完了";

    document.getElementById(`pad${playerIndex + 1}Name`)
        .textContent = pad.id;

    checkReady();
}

function checkReady(){

    let joined = 0;

    for(let i=0;i<targetPlayers;i++){
        if(players[i] !== null){
            joined++;
        }
    }

    document.getElementById("nextBtn").disabled =
        joined < targetPlayers;
}

function showConnectedPads(){

    const pads = navigator.getGamepads();

    let html = "<h2>接続中のコントローラー</h2>";

    let count = 0;

    for(let i=0;i<pads.length;i++){

        if(!pads[i]) continue;

        count++;

        html += `
            <div>
                Slot ${i}<br>
                ${pads[i].id}
            </div>
            <br>
        `;
    }

    if(count === 0){
        html += "接続されていません";
    }

    document.getElementById("connectedPads").innerHTML = html;
}

function updatePads(){

    const pads = navigator.getGamepads();

    for(let i=0;i<4;i++){

        const pad = pads[i];

        if(!pad){
            padBtnBf[i] = false;
            continue;
        }

        // Aボタン
        const btnNow = pad.buttons[0].pressed;

        // 押した瞬間だけ参加
        if(btnNow && !padBtnBf[i]){
            registerPad(i);
        }

        padBtnBf[i] = btnNow;
    }

    showConnectedPads();

    requestAnimationFrame(updatePads);
}

window.addEventListener("gamepadconnected", e => {
    console.log("接続:", e.gamepad.id);
});

window.addEventListener("gamepaddisconnected", e => {
    console.log("切断:", e.gamepad.id);
});

setPlayerCount(1);
updatePads();

</script>

</body>
</html>
